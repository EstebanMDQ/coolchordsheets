name: Release

# Publishes the Obsidian plugin files and the standalone library when a version tag is pushed.
# The tag must equal the version in manifest.json, for example: git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --notes "See CHANGELOG.md for details." \
            main.js manifest.json styles.css \
            dist/coolchordsheets.js dist/coolchordsheets.esm.js dist/coolchordsheets.css
