schema: spec-driven

context: |
  Obsidian community plugin written in TypeScript (strict mode, no `any`).
  Bundled with esbuild, tested with vitest and happy-dom. Runtime dependency is only the obsidian API.
  Domain: chord charts in the iReal Pro style, rendered from a fenced `chordsheet` code block.
  Layers: src/parser and src/chords are pure and never import obsidian; src/render and src/main.ts do.
  Formatting: never use em dashes or en dashes, use straight quotes.

rules:
  proposal:
    - Always include a Non-goals list in the Impact section
  specs:
    - Every requirement must state defaults, ranges and units where a value is involved
    - Every scenario must be automatically testable or explicitly marked manual
  tasks:
    - Every task must trace to a requirement in a spec
